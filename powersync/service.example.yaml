replication:
  connections:
    - type: postgresql
      uri: !env PS_DATABASE_URI
      sslmode: verify-full

storage:
  type: postgresql
  uri: !env PS_STORAGE_URI
  sslmode: verify-full

port: 8080

sync_config:
  path: sync-config.yaml

client_auth:
  jwks_uri: !env PS_JWKS_URI
  audience:
    - !env PS_AUDIENCE

system:
  logging:
    level: info
    format: json
